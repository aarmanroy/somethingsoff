# Publishes to crates.io when a GitHub Release goes out (cargo-dist creates
# the release on tag push). Uses crates.io Trusted Publishing (GitHub OIDC) —
# no long-lived token. NOTE: a brand-new crate cannot be first-published via
# OIDC; 0.1.0 was published manually, this covers subsequent releases. The
# trusted-publisher config lives in the crate's crates.io settings.
name: publish-crates

on:
  release:
    types: [published]
  # The `release` trigger above does not actually fire: dist creates the
  # GitHub Release with the default GITHUB_TOKEN, and events raised by that
  # token never start a new workflow run. 0.1.0 and 0.2.0 were both
  # published by hand as a result. Until that is rewired, run this manually
  # after the Release workflow goes green:
  #   gh workflow run publish-crates.yml --ref main
  # `.github/` is excluded from the package, so dispatching from main
  # produces a byte-identical tarball to the tag.
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
